_BASE_: "Base_det.yaml"

MODEL:
  WEIGHTS: "output/res50_pretrain_synth-tt-mlt-13-15-textocr.pth" 
  # WEIGHTS: "output/forbin_model_0048999.pth" # forbin_stamp.pth 
  TRANSFORMER:
    NUM_FEATURE_LEVELS: 4
    # NUM_POINTS: 4
    # LANGUAGE:
    #   CLASSES: ["Latin", ]
    #   VOC_SIZES: [["Latin", 37]]
    LOSS:
        BEZIER_SAMPLE_POINTS: 4
        BEZIER_CLASS_WEIGHT: 1.0
        BEZIER_COORD_WEIGHT: 1.0
        POINT_CLASS_WEIGHT: 1.0
        POINT_COORD_WEIGHT: 1.0
        LANGUAGE_WEIGHT: 1.0
        POINT_TEXT_WEIGHT: 0.0
        BOUNDARY_WEIGHT: 0.5
        TEXT_PENALTY: 0.0

DATASETS:
#   TRAIN: ("votre_dataset_fold0_train",)
#   TEST:  ("votre_dataset_fold0_val",)
  TEST: ("StaVer_test",) # StaVer_test hist_postcard_test

# 3) tailles d’entrée (le jeu historique est souvent haute résolution)
INPUT:
  MIN_SIZE_TRAIN: (800,900,1000,)
  MAX_SIZE_TRAIN: 1000
  MIN_SIZE_TEST: 800
  MAX_SIZE_TEST: 1000
  ROTATE: True         # garde True si tu as des pages pivotées

# 4) hyper-paramètres d’entraînement
SOLVER:
  IMS_PER_BATCH: 2          # 2 images × 1 GPU ; ajuste si +GPU
  BASE_LR: 1e-5             # LR ∝ batch_size / 16
  LR_BACKBONE: 1e-6
  STEPS: (10000, )           # décroissance LR optionnelle
  WARMUP_ITERS: 1000
  MAX_ITER: 50000         # ≈12 epochs si ~10 000 images
  CHECKPOINT_PERIOD: 1000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.1
    NORM_TYPE: 2.0

TEST:
  EVAL_PERIOD: 1000

OUTPUT_DIR: "output/forbin_stamp_k4"
# OUTPUT_DIR: "output/forbin_stamp_k8"
# OUTPUT_DIR: "output/forbin_stamp_k16"
# OUTPUT_DIR: "output/forbin_stamp_SEsin"
# OUTPUT_DIR: "output/forbin_stamp_table"