_BASE_: "Base_det.yaml"

MODEL:
  # WEIGHTS: "output/R50/150k_tt_mlt_13_15/pretrain/model_final.pth"
  WEIGHTS: "../checkpoints/res50_pretrain_synth-tt-mlt-13-15-textocr.pth" 
  TRANSFORMER:
    INFERENCE_TH_TEST: 0.3

DATASETS:
  TRAIN: ("icdar2015_train",)
  TEST: ("icdar2015_test",)
  # TRAIN: ("ic15_train",)
  # TEST: ("ic15_test",)

INPUT:
  MIN_SIZE_TRAIN: (800,900,1000,1100,1200,1300,1400)
  MAX_SIZE_TRAIN: 3000
  MIN_SIZE_TEST: 1440
  MAX_SIZE_TEST: 4000
  CROP:
    ENABLED: False
  ROTATE: False

SOLVER:
  IMS_PER_BATCH: 1
  BASE_LR: 1e-4
  LR_BACKBONE: 1e-6
  WARMUP_ITERS: 0
  STEPS: (5000, 10000, )
  MAX_ITER: 1000000
  CHECKPOINT_PERIOD: 1000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.1
    NORM_TYPE: 2.0

TEST:
  EVAL_PERIOD: 100
  # 1 - Generic, 2 - Weak, 3 - Strong (for icdar2015)
  # LEXICON_TYPE: 1

OUTPUT_DIR: "output/R50_ic15_test2"