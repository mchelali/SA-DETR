[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "torch>=1.3",
    "numpy",          # requis par torch utils
    "Pillow>=6.0",
    "termcolor>=1.1",
    "yacs>=0.1.6",
    "tabulate",
    "cloudpickle",
    "matplotlib",
    "tqdm>4.29.0",
    "tensorboard",
    "rapidfuzz",
    "Polygon3",
    "shapely",
    "scikit-image",
    "editdistance",
]
build-backend = "setuptools.build_meta"
