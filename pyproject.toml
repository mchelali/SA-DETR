[tool.poetry]
name = "sa-detr"
version = "0.1.0"
description = ""
authors = ["Mohamed CHELALI <mohamed.chelali@u-paris.fr>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
scikit-image = "0.25.2"
opencv-python = "4.11.0.86"
matplotlib = "3.10.1"
# augraphy = "^8.2.6"
scikit-learn = "1.6.1"
tqdm = "4.67.1"
# shapely = "^2.1.1"
albumentations = "^2.0.8"
hilbertcurve = "^2.0.5"
# sentence-transformers = "^4.1.0"
fvcore = "^0.1.5.post20221221"
cloudpickle = "^3.1.1"
omegaconf = "^2.3.0"
pycocotools = "^2.0.10"
torch = "2.2.0"
torchvision = "0.17.0"
torchsummary = "^1.5.1"
numpy = "<2"
einops = "^0.8.1"
shapely = "^2.1.1"
pyclipper = "^1.3.0.post6"
timm = "^1.0.15"


[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"


[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "torch>=1.3",
    "numpy",          # requis par torch utils
    "Pillow>=6.0",
    "termcolor>=1.1",
    "yacs>=0.1.6",
    "tabulate",
    "cloudpickle",
    "matplotlib",
    "tqdm>4.29.0",
    "tensorboard",
    "rapidfuzz",
    "Polygon3",
    "shapely",
    "scikit-image",
    "editdistance",
]
build-backend = "setuptools.build_meta"
